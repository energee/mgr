<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<!-- Reference copy of the Supabase dashboard Magic Link template (Auth → Email Templates).
     Paste the <table> fragment only; the dashboard supplies its own document wrapper.
     Colors are hex equivalents of the app theme tokens in src/app/globals.css. -->
<body style="margin: 0; padding: 0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f9fafb; padding: 40px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <tr>
      <td align="center">
        <table width="400" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border: 1px solid #dddedf; border-radius: 10px;">
          <tr>
            <td style="padding: 32px; text-align: center;">
              <!-- Unitank SVG icon — keep in sync with src/components/icons/mgr-logo.tsx -->
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                <path d="M5 7C5 5.9 5.9 5 7 5L17 5C18.1 5 19 5.9 19 7L19 15L12 22L5 15L5 7" />
                <line x1="6" y1="17" x2="6" y2="21" />
                <line x1="18" y1="17" x2="18" y2="21" />
              </svg>
              <span style="font-size: 20px; font-weight: 600; color: #0a0a0b; vertical-align: middle;">MGR</span>

              <h1 style="margin: 24px 0 8px; font-size: 24px; font-weight: 600; color: #0a0a0b; letter-spacing: -0.025em;">Sign in</h1>
              <p style="margin: 0 0 24px; font-size: 14px; color: #4c4d4f;">Click the button below to sign in to your brewery account.</p>

              <a href="{{ .ConfirmationURL }}" style="display: block; padding: 12px 0; background-color: #4665ae; color: #f8f8f8; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 6px;">Sign in to MGR</a>

              <p style="margin: 24px 0 12px; font-size: 14px; color: #4c4d4f;">Or enter this code manually:</p>

              <!-- Single box mirrors the OTP input on the login form; one text node so copy grabs digits only -->
              <span style="display: inline-block; padding: 12px 10px 12px 16px; border: 1px solid #dddedf; border-radius: 6px; font-size: 24px; font-weight: 500; letter-spacing: 6px; color: #0a0a0b; font-family: 'SF Mono', SFMono-Regular, Consolas, Menlo, monospace;">{{ .Token }}</span>

              <p style="margin: 24px 0 0; font-size: 12px; color: #9a9b9d;">If you didn't request this email, you can safely ignore it.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
