# Local-only Supabase configuration used by migration replay and integration tests.
# Hosted project settings are managed separately and are not changed by this file.
project_id = "phwjrfdtebftetctkhdr"

[api]
# The migration history predates Supabase's 2026 default-revoke change and the
# hosted project exposes tables through explicit/default grants. Preserve that
# behavior in the local replay until the chain captures every table grant.
auto_expose_new_tables = true

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# The historical seed.sql is application demo data, not part of schema replay.
# Keeping it disabled lets `supabase start` and `db reset --no-seed` validate only
# the migration chain from an empty database.
enabled = false
sql_paths = ["./seed.sql"]

# Auth settings below exist so the LOCAL stack can produce a sign-in email the
# app's own login forms accept. Without them the defaults emit a 6-digit code
# inside Supabase's stock magic-link template, which has no code in it at all —
# so no OTP login (staff or portal) is drivable locally, including from
# Playwright (e2e/portal-auth.setup.ts).
[auth]
# Playwright's default base URL. Both loopback spellings are allowed so a
# redirect built from `window.location.origin` is accepted either way.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]

[auth.email]
# Must match OTP_LENGTH in src/components/auth/otp-code-input.tsx — the Verify
# button stays disabled until exactly this many digits are entered.
otp_length = 8

[auth.email.template.magic_link]
# The repo's own template (also pasted into the hosted dashboard) is the only
# one that renders `{{ .Token }}`.
subject = "Your MGR sign-in link"
content_path = "./supabase/templates/magic-link.html"
