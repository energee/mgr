# .github/workflows/sentry-harness.yml
#
# Sentry Error Harness. Runs twice daily (noon and 5pm EST) and on manual
# dispatch. Score job pulls unresolved Sentry issues, ranks them, and emits
# up to 5 for the fix-error matrix. Each matrix job invokes Claude Code
# Action to analyze and fix one error, then opens a PR.

name: Sentry Error Harness

on:
  schedule:
    - cron: "0 17 * * *"   # Noon EST (UTC-5)
    - cron: "0 22 * * *"   # 5pm EST (UTC-5)
  workflow_dispatch:

jobs:
  score-errors:
    name: Score Sentry errors
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      errors: ${{ steps.score.outputs.errors }}
      count: ${{ steps.score.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Score Sentry issues
        id: score
        # SENTRY_ORG and SENTRY_PROJECT come from repo *variables*, not
        # secrets. Sentry permalinks ("https://sentry.io/organizations/<org>/
        # issues/...?project=<project>") embed both slugs verbatim, so the
        # JSON written to step outputs contains them. If either is stored
        # as a secret, GitHub Actions redacts the entire `errors` output
        # ("Skip output 'errors' since it may contain secret."), which then
        # breaks `fromJSON(...)` in the matrix strategy of the fix-error job.
        run: bun run .github/scripts/sentry-harness.ts
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_ENVIRONMENT: development
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fix-error:
    name: Fix error (${{ matrix.error.shortId }})
    needs: score-errors
    if: fromJSON(needs.score-errors.outputs.count) > 0
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # `write`, not `read`: step 0 of the fix prompt opens an investigation
      # issue via `gh issue create` when the root cause is in the database or a
      # third party rather than in application code.
      issues: write
      id-token: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        error: ${{ fromJSON(needs.score-errors.outputs.errors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Branch from the newest main commit whose Test workflow passed, not from
      # main's tip. A single unrelated red commit on main (e.g. a coverage
      # threshold slipping under its floor) otherwise fails CI on every PR this
      # harness opens, which reads as "the harness produced a bad fix" when it
      # produced nothing of the sort. Falls back to main's tip if no green run
      # is found in the last 50.
      - name: Check out last green main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh run list \
            --workflow=test.yml --branch=main --status=success \
            --limit 50 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ] || ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "No green main run found (or SHA unreachable); staying on main tip."
            exit 0
          fi
          echo "Branching from last green main: $sha"
          git checkout --detach "$sha"

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: ${{ matrix.error.prompt }}
          # Stream Claude's SDK output to the job log so a long-running fix
          # is observable in real time. GitHub Actions still redacts known
          # secrets in the stream, so the safety net the action's default
          # masking provides is largely preserved.
          show_full_output: "true"
          # Grant the toolset the prompt's pipeline actually needs:
          #  - Bash: validation (bun run typecheck/test/lint, make check),
          #    package install (bun add), and git/gh for branch/push/PR.
          #  - Edit/Write/MultiEdit: implement the fix and add tests.
          #  - Task: invoke /simplify and /code-review:code-review subagents.
          #  - WebFetch: occasional docs lookup (e.g. nextjs.org/docs).
          # Read/Grep/Glob are already on by default. Previous runs failed
          # silently with 9–19 permission_denials each because none of the
          # write/exec tools were allowed — Claude completed turns without
          # being able to apply, validate, or push the fix.
          # Sonnet is sufficient here. The harness's observed failure mode was
          # never weak reasoning — it was missing evidence: without the Sentry
          # event's contexts/extra bag, a Supabase RPC failure is indisting-
          # uishable from a bad error handler, so any model patches the handler.
          # The fix is the payload (see sentry-api.ts) and the step-0 triage gate
          # (see prompt.ts), not a heavier model. Revisit only if triage-passing
          # (A) fixes start coming back wrong on their merits.
          claude_args: '--model claude-sonnet-5 --allowed-tools "Bash,Edit,Write,MultiEdit,Read,Grep,Glob,TodoWrite,Task,WebFetch"'
          additional_permissions: |
            actions: read
