name: Database Security Lint

on:
  pull_request:
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/functions/**'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'

jobs:
  db-lint:
    name: Supabase Database Linter
    runs-on: ubuntu-latest

    # Use a standard postgres container from Docker Hub instead of supabase start
    # This avoids ghcr.io image availability issues entirely
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Supabase roles
        run: |
          # Create the roles that Supabase migrations expect
          psql "$DATABASE_URL" <<EOF
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          -- Mock auth.uid() function for RLS policies
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS \$\$
            SELECT NULL::uuid;
          \$\$ LANGUAGE sql;
          EOF

      - name: Apply migrations
        run: |
          # Apply all migrations in order using psql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -f "$migration"
          done

      - name: Run Database Linter
        id: lint
        run: |
          # Run the linter against our postgres instance
          supabase db lint --db-url "$DATABASE_URL" --level error > lint-output.txt 2>&1 || true

          # Check for ERROR level issues
          if grep -q "ERROR" lint-output.txt; then
            echo "::error::Database linter found ERROR-level security issues"
            cat lint-output.txt
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "No ERROR-level issues found"
            cat lint-output.txt
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Full Lint Report
        if: always()
        run: |
          echo "## Full Database Lint Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase db lint --db-url "$DATABASE_URL" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail on Errors
        if: steps.lint.outputs.has_errors == 'true'
        run: |
          echo "::error::Database security lint failed. See the lint report above for details."
          echo ""
          echo "Common fixes:"
          echo "- security_definer_view: Add 'WITH (security_invoker = true)' to views"
          echo "- auth_users_exposed: Don't join auth.users in views, cache user info instead"
          echo "- rls_disabled_in_public: Add 'ALTER TABLE x ENABLE ROW LEVEL SECURITY'"
          echo "- function_search_path_mutable: Add 'SET search_path = public' to functions"
          echo ""
          echo "See docs/spec/architecture.md for security guidelines."
          exit 1
