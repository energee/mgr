name: Database Security Lint

on:
  pull_request:
    paths:
      - "supabase/migrations/**/*.sql"
      - "supabase/functions/**"
      - "src/__tests__/integration/**"
      - "scripts/live-catalog.sql"
      - "vitest.integration.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/db-lint.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**/*.sql"
      - "supabase/functions/**"
      - "src/__tests__/integration/**"
      - "scripts/live-catalog.sql"
      - "vitest.integration.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/db-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-lint:
    name: Database Lint and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sslmode=disable is required by Supabase CLI v2.107+ when connecting to
      # the plain PostgreSQL service container.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: placeholder-not-used-without-gotrue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.109.1"

      - name: Create Supabase roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQLEOF'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          SQLEOF

      - name: Apply plain-Postgres Supabase shim
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/__tests__/integration/_fixtures/bootstrap-plain-postgres.sql

      # Both consumers use this one replay. ON_ERROR_STOP and one transaction
      # per migration prevent tests from seeing a silently half-built schema.
      - name: Apply migrations (from-scratch replay gate)
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
          done

      - name: Install plpgsql_check in the postgres service
        run: |
          docker exec ${{ job.services.postgres.id }} bash -ceu \
            'apt-get update -qq && apt-get install -y -qq postgresql-15-plpgsql-check'

      - name: Run Database Linter
        id: lint
        run: |
          lint_rc=0
          supabase db lint --db-url "$DATABASE_URL" > lint-output.txt 2>&1 || lint_rc=$?
          cat lint-output.txt

          {
            echo "## Full Database Lint Report"
            echo '```'
            cat lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "ERROR" lint-output.txt; then
            echo "::error::Database linter found ERROR-level security issues"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "$lint_rc" -ne 0 ]; then
            echo "::error::supabase db lint exited with code $lint_rc without reporting ERROR-level findings."
            exit "$lint_rc"
          else
            echo "No ERROR-level issues found"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed role fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/__tests__/integration/_fixtures/seed-roles.sql

      - name: Run integration tests
        run: bun run test:integration

      - name: Fail on database lint errors
        if: always() && steps.lint.outputs.has_errors == 'true'
        run: |
          echo "::error::Database security lint failed. See the report above."
          echo "See docs/spec/architecture.md for security guidelines."
          exit 1
