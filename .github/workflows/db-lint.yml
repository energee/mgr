name: Database Security Lint

on:
  pull_request:
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/functions/**'
      - 'src/__tests__/integration/_fixtures/bootstrap-plain-postgres.sql'
      # The db scripts have no other PR-triggered CI (live-drift is cron-only),
      # so this workflow syntax-checks them via the "Lint shell scripts" step.
      - 'scripts/*.sh'
      - 'scripts/live-catalog.sql'
      - '.github/workflows/db-lint.yml'
      - '.github/workflows/live-drift.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'scripts/*.sh'
      - 'scripts/live-catalog.sql'
      - '.github/workflows/db-lint.yml'
      - '.github/workflows/live-drift.yml'

permissions:
  contents: read

jobs:
  db-lint:
    name: Supabase Database Linter
    runs-on: ubuntu-latest

    # Use a standard postgres container from Docker Hub instead of supabase start
    # This avoids ghcr.io image availability issues entirely
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sslmode=disable is required by the Supabase CLI's TypeScript db-lint
      # (v2.107+): a --db-url without sslmode is treated as remote and tried
      # TLS-only with no plaintext fallback, so it can never reach the plain
      # postgres service container. psql/libpq accepts the param unchanged.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          # scripts/check-live-drift.sh and scripts/db-push.sh have no other
          # PR-triggered CI since the live-drift check went cron-only; catch
          # shell syntax errors (and shellcheck findings when the runner has
          # it — ubuntu-latest does) before they break the watchdog.
          status=0
          for f in scripts/*.sh; do
            bash -n "$f" || status=1
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning scripts/*.sh || status=1
          else
            echo "::notice::shellcheck not available on this runner; ran bash -n only"
          fi
          exit "$status"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Supabase roles
        run: |
          # Create the roles that Supabase migrations expect. Schemas, auth.*
          # helpers, and out-of-band table stubs come from the shared fixture
          # in the next step. ON_ERROR_STOP so a failed role/grant statement
          # fails the job instead of silently linting a half-set-up database.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<EOF
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          EOF

      - name: Apply plain-Postgres Supabase shim
        run: |
          # auth schema/users/uid(), realtime publication, default privileges,
          # and stubs for tables created out-of-band on live. Same fixture the
          # integration tests use.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f src/__tests__/integration/_fixtures/bootstrap-plain-postgres.sql

      - name: Apply migrations (from-scratch replay gate)
        run: |
          # Apply all migrations in order. ON_ERROR_STOP makes this a real
          # gate: a PR whose migration cannot replay from scratch fails here
          # instead of silently linting a half-built database.
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run Database Linter
        id: lint
        run: |
          # Run the linter against our postgres instance. Capture the exit
          # code (instead of `|| true`) so "lint ran and found nothing" is
          # distinguishable from "lint crashed before printing anything" —
          # a crashed CLI must fail the step, not pass it green.
          lint_rc=0
          supabase db lint --db-url "$DATABASE_URL" --level error > lint-output.txt 2>&1 || lint_rc=$?

          cat lint-output.txt

          # Check for ERROR level issues
          if grep -q "ERROR" lint-output.txt; then
            echo "::error::Database linter found ERROR-level security issues"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "$lint_rc" -ne 0 ]; then
            echo "::error::supabase db lint exited with code $lint_rc without reporting ERROR-level findings — the linter did not run (CLI crash?)."
            exit "$lint_rc"
          else
            echo "No ERROR-level issues found"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Full Lint Report
        if: always()
        run: |
          echo "## Full Database Lint Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase db lint --db-url "$DATABASE_URL" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail on Errors
        if: steps.lint.outputs.has_errors == 'true'
        run: |
          echo "::error::Database security lint failed. See the lint report above for details."
          echo ""
          echo "Common fixes:"
          echo "- security_definer_view: Add 'WITH (security_invoker = true)' to views"
          echo "- auth_users_exposed: Don't join auth.users in views, cache user info instead"
          echo "- rls_disabled_in_public: Add 'ALTER TABLE x ENABLE ROW LEVEL SECURITY'"
          echo "- function_search_path_mutable: Add 'SET search_path = public' to functions"
          echo ""
          echo "See docs/spec/architecture.md for security guidelines."
          exit 1
