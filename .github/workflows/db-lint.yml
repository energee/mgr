name: Database Security Lint

# PR-only gate. The push-to-main re-run was dropped (squash merge lands the
# tree the PR run already validated) and package.json/bun.lock were removed
# from the trigger paths — dependency bumps were replaying the full migration
# chain for no schema signal. The daily live-drift watchdog covers
# out-of-band schema changes.
#
# #713: `Database Lint and Integration Tests` is a REQUIRED status check on
# `main`, so it must report a conclusion on EVERY pull request. A `paths:`
# filter on `on:` cannot do that — GitHub never queues the workflow for a
# filtered-out PR, so the required context stays pending forever and a
# docs-only PR becomes unmergeable. The filter is therefore gone and this
# workflow runs unconditionally.
#
# Running it everywhere is affordable: measured on PR #790 (2026-08-12) this
# workflow finishes in ~3m13s while `E2E Tests` in test.yml takes ~5m50s on
# every PR regardless. db-lint is therefore never the critical path, and
# Actions minutes are free on this public repo. That measurement is the whole
# reason there is no shim here: an always-reporting gate job around a filtered
# heavy lane was built first (+157 lines) and discarded in favour of deleting
# nine.
#
# The `supabase-reset` job ("Fresh Supabase Migration Replay", `make db-dry-run`)
# was removed 2026-08-21. It booted a third Docker Supabase per PR to replay a
# chain that two other jobs already replay: `db-lint` below applies every file
# with `psql -1 -v ON_ERROR_STOP=1`, and `e2e` in test.yml runs the same
# `supabase start` the removed job did. It was advisory, never a required
# context, and on PR #878 all it produced was a second red X for a failure
# `E2E Tests` had already reported. The one thing it caught that the psql loop
# cannot — a duplicate `NNNNN_` version prefix colliding in
# supabase_migrations.schema_migrations — is now caught statically by
# `make check-db`, before the push, and still by `e2e`'s CLI boot after it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-lint:
    name: Database Lint and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # sslmode=disable is required by Supabase CLI v2.107+ when connecting to
      # the plain PostgreSQL service container.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: placeholder-not-used-without-gotrue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Read-only job; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"

      - name: Create Supabase roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQLEOF'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          SQLEOF

      - name: Apply plain-Postgres Supabase shim
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/__tests__/integration/_fixtures/bootstrap-plain-postgres.sql

      # Both consumers use this one replay. ON_ERROR_STOP and one transaction
      # per migration prevent tests from seeing a silently half-built schema.
      - name: Apply migrations (from-scratch replay gate)
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
          done

      - name: Install plpgsql_check in the postgres service
        run: |
          docker exec ${{ job.services.postgres.id }} bash -ceu \
            'apt-get update -qq && apt-get install -y -qq postgresql-15-plpgsql-check'

      - name: Run Database Linter
        id: lint
        run: |
          lint_rc=0
          supabase db lint --db-url "$DATABASE_URL" > lint-output.txt 2>&1 || lint_rc=$?
          cat lint-output.txt

          {
            echo "## Full Database Lint Report"
            echo '```'
            cat lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "ERROR" lint-output.txt; then
            echo "::error::Database linter found ERROR-level security issues"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "$lint_rc" -ne 0 ]; then
            echo "::error::supabase db lint exited with code $lint_rc without reporting ERROR-level findings."
            exit "$lint_rc"
          else
            echo "No ERROR-level issues found"
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed role fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/__tests__/integration/_fixtures/seed-roles.sql

      - name: Run integration tests
        run: bun run test:integration

      - name: Fail on database lint errors
        if: always() && steps.lint.outputs.has_errors == 'true'
        run: |
          echo "::error::Database security lint failed. See the report above."
          echo "See docs/spec/architecture.md for security guidelines."
          exit 1
