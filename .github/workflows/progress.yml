# Rebuilds the generated PROGRESS.md whenever entry files under docs/progress/
# change on main (see scripts/build-progress.sh for the format). The generated
# file lands through a bot PR because the main ruleset correctly rejects direct
# pushes, including pushes from GITHUB_TOKEN.
name: Build PROGRESS.md

on:
  push:
    branches: [main]
    paths:
      - "docs/progress/**"
      - "scripts/build-progress.sh"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-progress
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Rebuild PROGRESS.md
        run: bash scripts/build-progress.sh
      - name: Commit and merge if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet PROGRESS.md; then
            echo "PROGRESS.md already up to date"
            exit 0
          fi

          branch="automation/build-progress"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add PROGRESS.md
          # No skip-ci marker: static, unit and E2E report on every PR, so the
          # bot PR must let them run (they pass — nothing depends on
          # PROGRESS.md) rather than suppressing them. Since 2026-08-12 (#713)
          # they ARE required status checks on `main`, so `--auto` genuinely
          # waits on them now.
          #
          # KNOWN BREAKAGE, not fixed here (#844): this job authors its PR with
          # `secrets.GITHUB_TOKEN`, and a GITHUB_TOKEN-authored PR triggers no
          # workflows at all — so the required contexts never report and the PR
          # is BLOCKED with nothing red to fix, leaving `--auto` waiting
          # forever. That is exactly how bot PR #836 stranded (2026-08-18 ->
          # 2026-08-20). Until this job holds an app or PAT credential, its PRs
          # need a human close/reopen to make the checks start.
          git commit -m "docs(progress): rebuild PROGRESS.md"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push --force-with-lease origin "HEAD:$branch"
          fi

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "docs(progress): rebuild PROGRESS.md" \
              --body "Automated rebuild from docs/progress entries.")"
            pr_number="${pr_url##*/}"
          fi

          # --auto: queue the merge behind the required checks (#713 made
          # Static/Unit/E2E/db-lint required on main). GitHub intermittently
          # answers "Pull request is in unstable status
          # (enablePullRequestAutoMerge)" when the PR's checks have not started
          # reporting yet — a race, not a real failure (~1/3 of runs before
          # this retry; see docs/agents/ci.md). Retry with backoff instead of
          # going red and leaving the bot PR open (#805 was one).
          for attempt in 1 2 3 4; do
            if gh pr merge "$pr_number" \
              --auto \
              --squash \
              --delete-branch \
              --subject "docs(progress): rebuild PROGRESS.md"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "gh pr merge attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::could not enable auto-merge for PR #${pr_number} after 4 attempts"
          exit 1
