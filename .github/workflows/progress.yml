# Rebuilds the generated PROGRESS.md whenever entry files under docs/progress/
# change on main (see scripts/build-progress.sh for the format). The generated
# file lands through a bot PR because the main ruleset correctly rejects direct
# pushes, including pushes from GITHUB_TOKEN.
name: Build PROGRESS.md

on:
  push:
    branches: [main]
    paths:
      - "docs/progress/**"
      - "scripts/build-progress.sh"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-progress
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Rebuild PROGRESS.md
        run: bash scripts/build-progress.sh
      - name: Commit and merge if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet PROGRESS.md; then
            echo "PROGRESS.md already up to date"
            exit 0
          fi

          branch="automation/build-progress"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add PROGRESS.md
          # No skip-ci marker: static, unit and E2E report on every PR, so the
          # bot PR must let them run (they pass — nothing depends on
          # PROGRESS.md) rather than suppressing them. They are NOT required
          # status checks — ruleset `main` (11725742) declares no
          # `required_status_checks` rule — so `--auto` below does not actually
          # wait on them today; keep the marker off anyway, so the day they are
          # made required this job does not start hanging.
          git commit -m "docs(progress): rebuild PROGRESS.md"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push --force-with-lease origin "HEAD:$branch"
          fi

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "docs(progress): rebuild PROGRESS.md" \
              --body "Automated rebuild from docs/progress entries.")"
            pr_number="${pr_url##*/}"
          fi

          # --auto: queue the merge behind whatever checks are required rather
          # than merging immediately. No context is required on `main` today,
          # so this currently merges as soon as GitHub allows; it is here so
          # the job keeps working unchanged once contexts are made required
          # (an immediate merge would start failing at that point).
          gh pr merge "$pr_number" \
            --auto \
            --squash \
            --delete-branch \
            --subject "docs(progress): rebuild PROGRESS.md"
