name: Claude Code

# durable-state: exempt — interactive, human-triggered runs; the mention
# thread (and the action's comment reply) is the durable record, and the
# requesting human is watching the outcome. Scheduled agentic loops instead
# end with .github/actions/require-durable-outcome (contract-tested).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Public repo: in addition to the mention check, each event branch also
    # requires the triggering actor to be a repo insider (OWNER/MEMBER/
    # COLLABORATOR). claude-code-action performs its own write-permission
    # check; this job-level gate is defense-in-depth so drive-by comments
    # never even start a run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # claude-code-action posts a tracking comment before it does any work, so
    # issues/pull-requests must be `write` — with `read` the action fails on
    # its first API call. The read-only variant shipped in #572 was never
    # exercised (no @claude mention has triggered a non-skipped run since),
    # which is why the breakage went unnoticed. The insider gate above is what
    # keeps these writes safe on a public repo.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # contents: read job — claude-code-action authenticates its own
          # git operations; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Without an explicit allowlist the action's Bash tool is limited to a
          # tiny default set, so Claude cannot run this repo's own tooling — it
          # hit exactly that on PR #648 (couldn't `bun install` to regenerate a
          # dependabot lockfile) and had to hand the fix back to a human.
          # Scoped to package-manager / build / read-only inspection commands;
          # commits and pushes go through claude-code-action's own git plumbing,
          # so no `git push` here.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          #
          # web-egress: allowed (job: claude) — interactive, insider-gated runs
          #   where the requesting human often wants Claude to read the page
          #   they just linked. #655 briefly denied WebFetch/WebSearch here;
          #   #661 dropped that when it granted this job a scoped Bash
          #   allowlist, and this comment records why that is defensible rather
          #   than leaving the gap undeclared. Two reasons. (1) The allowlist
          #   below already reaches the network — Bash(bunx:*) fetches and
          #   executes arbitrary npm packages, Bash(bun run:*) and Bash(make:*)
          #   run this repo's scripts — so denying the two web tools while
          #   granting those would be the false-posture pattern documented in
          #   docs/agents/ci.md, not a closed one. (2) The threat model is
          #   materially weaker than sentry-harness.yml's: a human triggered the
          #   run and is watching it. What that argument does NOT rest on — an
          #   earlier version of this comment said it did — is the checkout's
          #   persist-credentials: false. At the pinned action SHA,
          #   configureGitAuth() writes
          #   https://x-access-token:<token>@github.com/... into the origin
          #   remote right after checkout, so a push-capable token DOES sit in
          #   this workspace; this job holds three write scopes and mints an app
          #   token on top. Still not risk-free — fork-PR diffs and third-party
          #   issue text are unvetted input — so the tradeoff is #669's to
          #   settle. Contract: ci-workflows.test.ts enumerates every such
          #   marker, so this opt-out cannot be silent.
          claude_args: >-
            --allowed-tools
            "Bash(bun install),Bash(bun install:*),Bash(bun run:*),Bash(bunx:*),Bash(make:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh run view:*)"
