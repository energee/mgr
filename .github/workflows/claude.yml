name: Claude Code

# durable-state: exempt — interactive, human-triggered runs; the mention
# thread (and the action's comment reply) is the durable record, and the
# requesting human is watching the outcome. Scheduled agentic loops instead
# end with .github/actions/require-durable-outcome (contract-tested).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Public repo: in addition to the mention check, each event branch also
    # requires the triggering actor to be a repo insider (OWNER/MEMBER/
    # COLLABORATOR). claude-code-action performs its own write-permission
    # check; this job-level gate is defense-in-depth so drive-by comments
    # never even start a run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # claude-code-action posts a tracking comment before it does any work, so
    # issues/pull-requests must be `write` — with `read` the action fails on
    # its first API call. The read-only variant shipped in #572 was never
    # exercised (no @claude mention has triggered a non-skipped run since),
    # which is why the breakage went unnoticed. The insider gate above is what
    # keeps these writes safe on a public repo.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # contents: read job — claude-code-action authenticates its own
          # git operations; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          #
          # No web egress. This job runs with contents/pull-requests/issues
          # write and reads whatever the mention thread points at — including
          # fork-PR diffs and third-party issue text, which nobody vetted. The
          # insider gate limits who can *start* a run, not what the run then
          # reads, so an injected instruction in that content would otherwise
          # have an outbound network tool in a credentialed job. Every
          # generative job in this repo denies these two explicitly (contract
          # in .github/scripts/ci-workflows.test.ts); if a request genuinely
          # needs an external page, paste its content into the comment.
          claude_args: '--disallowedTools "WebFetch,WebSearch"'
