name: Live DB Drift Check

# Watchdog: diffs the live database catalog (functions + signatures + body
# hashes, triggers, tables, RLS policies + row-security flags) against the
# committed snapshot in supabase/live-catalog.snapshot.txt. Catches the C2/C3
# class of bug where enforcement objects are dropped or edited out-of-band on
# live while db push still reports a clean no-op. See
# scripts/check-live-drift.sh.
#
# Severity is classified: objects the snapshot expects that are missing or
# changed on live FAIL the run; live-only additions (usually an in-flight
# feature branch applied to live before merge, or a snapshot update that
# wasn't committed) only WARN.
#
# The script also diffs the committed migration chain against
# supabase_migrations.schema_migrations on live (#693): a migration that is
# committed but never applied FAILs (the catalog diff alone cannot see it —
# snapshot and live are both post-apply artifacts); live-only versions WARN.
#
# Deliberately NOT a pull_request gate. PR-time comparison against live forced
# an apply-before-merge ordering and made concurrent migration PRs fail each
# other's runs. The PR-time question — "does the migration chain still replay
# from scratch?" — is answered deterministically by db-lint.yml instead.
#
# Requires repository secret SUPABASE_DB_URL: a READ-ONLY Postgres connection
# string to the live project (e.g. a dedicated read-only login role via the
# session pooler). The check only reads pg_catalog.

on:
  # Watchdog for out-of-band drift that no PR would surface.
  schedule:
    - cron: '0 12 * * *' # daily 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # upsert/close the single `live-drift` tracking issue

jobs:
  live-drift:
    name: Live catalog vs migration chain
    runs-on: ubuntu-latest
    # Opens a network connection to the live database; a hung psql must not
    # sit on the 6-hour job default.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Read-only job; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Verify PostgreSQL client
        # ubuntu-latest already includes psql; avoid an 11-second apt install.
        run: psql --version

      - name: Check live drift
        id: drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            # On the schedule this workflow IS the only drift net: a rotated or
            # deleted secret must fail loudly, not turn the cron green forever.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::error::SUPABASE_DB_URL secret is not configured (rotated/deleted?) — the scheduled live-drift watchdog cannot run. Restore the read-only connection-string secret."
              exit 1
            fi
            echo "::warning::SUPABASE_DB_URL secret is not configured; skipping live-drift check (non-schedule run)."
            exit 0
          fi
          # Distinguish real drift (exit 1 = catalog drift, exit 4 =
          # committed-but-unapplied migrations, #812) from infra failure
          # (missing secret above, psql connection errors = exit 2) so the
          # issue upsert below only fires on genuine drift.
          if bash scripts/check-live-drift.sh; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "kind=catalog" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 4 ]; then
              echo "drift=true" >> "$GITHUB_OUTPUT"
              echo "kind=unapplied" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          fi

      # Single tracking issue for real drift, mirroring the health-audit.yml
      # publisher philosophy: one deterministic step owns issue mutations and
      # dedupes by label before creating anything. Note: billing-blocked runs
      # never start this job at all, so an issue that stops receiving updates
      # (or a cron with no runs) means infra failure, not "drift resolved" —
      # only an explicit green run closes the issue.
      - name: Upsert drift tracking issue
        if: failure() && steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: ${{ steps.drift.outputs.kind }}
        run: |
          set -euo pipefail
          # Exit 4 means committed-but-unapplied migrations with a CLEAN
          # catalog (#812) — the issue must say so, not claim catalog drift.
          if [ "$KIND" = "unapplied" ]; then
            title="Committed migrations not applied to live"
            body="The scheduled live-drift watchdog found committed migrations in \`supabase/migrations/\` that are not applied to the live database (the catalog itself matches the snapshot): ${RUN_URL}

          Apply them with \`scripts/db-push.sh\`. Maintained by \`.github/workflows/live-drift.yml\`; closed automatically on the next clean run."
          else
            title="Live DB drift detected (snapshot vs live catalog)"
            body="The scheduled live-drift watchdog found the live database catalog out of sync with \`supabase/live-catalog.snapshot.txt\`: ${RUN_URL}

          See the run log for the exact missing/changed objects. Maintained by \`.github/workflows/live-drift.yml\`; closed automatically on the next clean run."
          fi
          gh label create live-drift --repo "$REPO" \
            --color D93F0B --description "Live database drifted from committed snapshot" \
            2>/dev/null || true
          existing="$(gh issue list --repo "$REPO" --label live-drift --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing on the latest scheduled check (${KIND:-catalog}): ${RUN_URL}"
          else
            gh issue create --repo "$REPO" --title "$title" --label live-drift \
              --body "$body"
          fi

      # A watchdog that can only report "drift" has no way to say "I am blind".
      # 19 of the last 20 scheduled runs failed this way (billing block, then
      # connection failures) and produced no issue at all — the outage was
      # visible only as a red run nobody opens. Infra failures now get their
      # own tracking issue, distinct from real drift.
      - name: Upsert watchdog-down issue on infra failure
        if: failure() && steps.drift.outputs.drift != 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create watchdog-down --repo "$REPO" \
            --color FBCA04 --description "A scheduled watchdog could not run" \
            2>/dev/null || true
          existing="$(gh issue list --repo "$REPO" --label watchdog-down --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still unable to check live drift: ${RUN_URL}"
          else
            gh issue create --repo "$REPO" \
              --title "Live-drift watchdog is down (cannot reach the live catalog)" \
              --label watchdog-down \
              --body "The scheduled live-drift check failed before it could compare anything — a missing/rotated \`SUPABASE_DB_URL\`, a billing-blocked job, or a connection error: ${RUN_URL}

          While this is open the repo has NO live-schema drift detection. Maintained by \`.github/workflows/live-drift.yml\`; closed automatically on the next run that completes a comparison."
          fi

      # Any run that produced a drift verdict (true OR false) proves the
      # watchdog reached the database, so the outage issue closes even when
      # the run is red for real drift.
      - name: Close watchdog-down issue once a comparison completes
        if: always() && steps.drift.outputs.drift != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --label watchdog-down --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Drift comparison completed again: ${RUN_URL}. Closing."
            gh issue close "$existing" --repo "$REPO"
          fi

      - name: Close drift issue on clean run
        if: success() && steps.drift.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --label live-drift --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Live catalog matches the snapshot again: ${RUN_URL}. Closing."
            gh issue close "$existing" --repo "$REPO"
          fi
