name: Live DB Drift Check

# Watchdog: diffs the live database catalog (functions + signatures + body
# hashes, triggers, tables, RLS policies + row-security flags) against the
# committed snapshot in supabase/live-catalog.snapshot.txt. Catches the C2/C3
# class of bug where enforcement objects are dropped or edited out-of-band on
# live while db push still reports a clean no-op. See
# scripts/check-live-drift.sh.
#
# Severity is classified: objects the snapshot expects that are missing or
# changed on live FAIL the run; live-only additions (usually an in-flight
# feature branch applied to live before merge, or a snapshot update that
# wasn't committed) only WARN.
#
# Deliberately NOT a pull_request gate. PR-time comparison against live forced
# an apply-before-merge ordering and made concurrent migration PRs fail each
# other's runs. The PR-time question — "does the migration chain still replay
# from scratch?" — is answered deterministically by db-lint.yml instead.
#
# Requires repository secret SUPABASE_DB_URL: a READ-ONLY Postgres connection
# string to the live project (e.g. a dedicated read-only login role via the
# session pooler). The check only reads pg_catalog.

on:
  # Watchdog for out-of-band drift that no PR would surface.
  schedule:
    - cron: '0 12 * * *' # daily 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-drift:
    name: Live catalog vs migration chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Read-only job; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Verify PostgreSQL client
        # ubuntu-latest already includes psql; avoid an 11-second apt install.
        run: psql --version

      - name: Check live drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            # On the schedule this workflow IS the only drift net: a rotated or
            # deleted secret must fail loudly, not turn the cron green forever.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::error::SUPABASE_DB_URL secret is not configured (rotated/deleted?) — the scheduled live-drift watchdog cannot run. Restore the read-only connection-string secret."
              exit 1
            fi
            echo "::warning::SUPABASE_DB_URL secret is not configured; skipping live-drift check (non-schedule run)."
            exit 0
          fi
          bash scripts/check-live-drift.sh
