name: Live DB Drift Check

# Diffs the live database catalog (functions + signatures + body hashes,
# triggers, tables) against the committed snapshot in
# supabase/live-catalog.snapshot.txt. Catches the C2/C3 class of bug where
# enforcement objects are dropped out-of-band on live while db push still
# reports a clean no-op. See scripts/check-live-drift.sh.
#
# Requires repository secret SUPABASE_DB_URL: a READ-ONLY Postgres connection
# string to the live project (e.g. a dedicated read-only login role via the
# session pooler). The check only reads pg_catalog.

on:
  # Watchdog for out-of-band drift that no PR would surface.
  schedule:
    - cron: '0 12 * * *' # daily 12:00 UTC
  # Gate migration changes: a PR that alters the catalog must update the snapshot.
  pull_request:
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/live-catalog.snapshot.txt'
      - 'scripts/check-live-drift.sh'
      - 'scripts/live-catalog.sql'
      - '.github/workflows/live-drift.yml'
  workflow_dispatch: {}

jobs:
  live-drift:
    name: Live catalog vs migration chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check live drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not configured; skipping live-drift check."
            exit 0
          fi
          bash scripts/check-live-drift.sh
