name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Unit Tests (coverage gate)
        # --coverage enforces the thresholds in vitest.config.ts; a plain
        # `bun run test` never applied them in CI.
        run: bun run test:coverage

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        run: bun pm audit --level high
        continue-on-error: true

  e2e-secrets-check:
    name: E2E Secrets Check
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Verify E2E secrets configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -n "$SUPABASE_URL" ]      || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$E2E_EMAIL" ]         || missing+=("E2E_USER_EMAIL")
          [ -n "$E2E_PASSWORD" ]      || missing+=("E2E_USER_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=E2E skipped::Missing required secrets: ${missing[*]}. Configure via gh secret set (or repo Settings → Secrets) to enable e2e tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality, e2e-secrets-check]
    if: needs.e2e-secrets-check.outputs.configured == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
