name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Unit Tests (coverage gate)
        # --coverage enforces the thresholds in vitest.config.ts; a plain
        # `bun run test` never applied them in CI.
        run: bun run test:coverage

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        run: bun pm audit --level high
        continue-on-error: true

  integration-tests:
    name: Integration Tests (RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: placeholder-not-used-without-gotrue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Supabase roles
        run: |
          psql "$DATABASE_URL" <<'SQLEOF'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          GRANT anon TO authenticator;
          GRANT authenticated TO authenticator;
          GRANT service_role TO authenticator;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $$
            SELECT current_setting('request.jwt.claims', true)::jsonb->>'sub'
            UNION ALL SELECT NULL::uuid LIMIT 1;
          $$ LANGUAGE sql;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text AS $$
            SELECT current_setting('request.jwt.claims', true)::jsonb->>'role'
            UNION ALL SELECT 'anon' LIMIT 1;
          $$ LANGUAGE sql;
          SQLEOF

      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration..."
            psql "$DATABASE_URL" -f "$migration"
          done

      - name: Seed role fixtures
        run: psql "$DATABASE_URL" -f src/__tests__/integration/_fixtures/seed-roles.sql

      - name: Run integration tests
        run: bun run test:integration

  e2e-secrets-check:
    name: E2E Secrets Check
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Verify E2E secrets configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -n "$SUPABASE_URL" ]      || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$E2E_EMAIL" ]         || missing+=("E2E_USER_EMAIL")
          [ -n "$E2E_PASSWORD" ]      || missing+=("E2E_USER_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=E2E skipped::Missing required secrets: ${missing[*]}. Configure via gh secret set (or repo Settings → Secrets) to enable e2e tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality, e2e-secrets-check]
    if: needs.e2e-secrets-check.outputs.configured == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
