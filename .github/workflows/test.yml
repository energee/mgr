# CI model (public repo — Actions minutes are unlimited/free):
# Static + unit run on EVERY PR, including docs-only ones, so the
# "Static Checks" and "Unit Tests" contexts always report and can be
# configured as required status checks on main. Build + E2E stay on a
# weekday nightly schedule against main instead of on every merge — local
# `make check` already runs the build before commit, Vercel builds every
# deploy, and the nightly catches squash-merge drift within 24h.
name: Test

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekday nightly full run (static + unit + build + E2E) on main, 06:13 UTC.
    - cron: "13 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Restore static-analysis caches
        uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig.json') }}
          restore-keys: static-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Database policy checks
        run: make check-db

      - name: Feature WIP check
        run: make check-wip

      - name: Agent configuration checks
        run: make check-agent-config

  unit-tests:
    # Single unsharded job: sharding across two runners doubled the
    # install/setup overhead and needed a third job to merge coverage blobs.
    # One runner is ~2 min slower wall-clock but ~5 billable min cheaper,
    # and aggregate coverage thresholds are enforced directly here.
    name: Unit Tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage thresholds
        run: bunx vitest run --coverage

  build:
    # Nightly/dispatch only — not per-PR or per-merge. `make check` runs the
    # same build locally before every commit, and Vercel builds on deploy.
    name: Production Build
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        # Exception requirements: docs/security/dependency-policy.md
        run: bun audit --audit-level=high

  # Nightly-only (same gate as build). Boots an isolated local Supabase stack
  # instead of pointing Playwright at hosted credentials — the hosted E2E
  # secrets were never configured, so the old secrets-gated job silently
  # skipped and the browser suite never actually ran.
  e2e:
    name: E2E Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    env:
      # Opt-in gate for /api/auth/dev-login, which e2e/auth.setup.ts uses to
      # obtain a session. That route 404s unless this is exactly "1" or
      # NODE_ENV=development; this lane serves a production `next build` via
      # `bun start`, where NODE_ENV is "production", so without the flag the
      # `setup` project timed out and every authenticated spec failed (#644).
      # Job-scoped (not step-scoped) so it covers both the build and the server
      # Playwright boots, regardless of whether Next reads it at build or run
      # time. Safe here and nowhere else: ephemeral runner, throwaway local
      # Supabase stack, no hosted data reachable.
      E2E_DEV_LOGIN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"

      - name: Start isolated local Supabase
        run: |
          set -euo pipefail
          supabase start --exclude vector
          eval "$(supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Built here, after the local stack is up, because NEXT_PUBLIC_* values
      # are inlined at build time — the `build` job's artifact is compiled
      # against the hosted project and cannot serve this isolated database.
      # Playwright then runs `bun start` against this build (playwright.config
      # .ts) instead of dev-compiling every route on first hit.
      - name: Build against the local stack
        run: bun run build

      - name: Run E2E tests
        run: bun e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
