name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Restore static-analysis caches
        uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig.json') }}
          restore-keys: static-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Database policy checks
        run: make check-db

      - name: Feature WIP check
        run: make check-wip

      - name: Agent configuration checks
        run: make check-agent-config

  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/2)
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage shard
        env:
          # Per-shard coverage is incomplete by definition. The merge job
          # enforces the unchanged aggregate thresholds after joining blobs.
          VITEST_COVERAGE_SHARD: "true"
        run: bunx vitest run --shard=${{ matrix.shard }}/2 --coverage --reporter=blob

      - name: Upload Vitest blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 1
          include-hidden-files: true

  coverage:
    name: Unit Tests (coverage gate)
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Vitest blobs
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        run: bunx vitest --merge-reports=.vitest-reports --coverage --reporter=default

  build:
    name: Production Build
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        # Exception requirements: docs/security/dependency-policy.md
        run: bun audit --audit-level=high

  quality:
    name: Code Quality
    needs: [static, coverage, build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm layered quality gate
        run: echo "Static checks, aggregate unit coverage, and production build passed."

  e2e-secrets-check:
    name: E2E Secrets Check
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Verify E2E secrets configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -n "$SUPABASE_URL" ]      || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$E2E_EMAIL" ]         || missing+=("E2E_USER_EMAIL")
          [ -n "$E2E_PASSWORD" ]      || missing+=("E2E_USER_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=E2E skipped::Missing required secrets: ${missing[*]}. Configure via gh secret set (or repo Settings → Secrets) to enable e2e tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality, e2e-secrets-check]
    if: needs.e2e-secrets-check.outputs.configured == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
