# CI model (public repo — Actions minutes are unlimited/free):
# Static, unit AND Playwright E2E run on EVERY PR, including docs-only ones,
# so their contexts always report. NOTE: none of them is a *required* status
# check today — ruleset `main` (id 11725742) declares no `required_status_checks`
# rule at all, and the branch has no legacy protection, so a red check here is
# a visible failure but does not block a merge. Making them required is an
# owner-only repository-settings change (docs/agents/ci.md). What this file
# controls is that the contexts always report, which is the precondition.
#
# Nothing here is path-filtered, and only `build` carries an event gate:
# GitHub reports a job that did not run as "skipped", and a skipped check reads
# as green everywhere conclusions are consumed — including as a required status
# check, were one configured. So every way of not running a job is a way of
# turning its check green without testing anything, which is exactly how the
# old secrets-gated E2E job read healthy for months (issue #437).
#
# E2E was kept off the PR lane on 2026-07-17 by the CI-minutes diet (#522).
# That rationale expired on 2026-07-24 when this repository went public:
# Actions minutes are free, so keeping the browser suite off pull requests buys
# nothing. Moved onto the PR lane 2026-07-30 (#437) — for the FIRST time, not
# restored: it had never run on a pull_request event before (see the e2e job's
# own header). Do not "restore the diet" for this job — re-read #522 first; the
# constraint it optimised for is gone.
# The rest of #522 stands (unsharded vitest, no per-merge CI on main).
#
# `build` alone stays nightly/dispatch, because it compiles against the HOSTED
# Supabase credentials, which fork pull requests cannot read. Pull requests
# still compile the app: the e2e job runs its own `bun run build` against its
# local stack, so a broken build fails a PR either way.
name: Test

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekday nightly full run (static + unit + build + E2E) on main, 06:13 UTC.
    - cron: "13 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Restore static-analysis caches
        uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig.json') }}
          restore-keys: static-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Database policy checks
        run: make check-db

      - name: Feature WIP check
        run: make check-wip

      # #654: a migration-backed feature cannot read `passing` without a
      # structured deployment record saying whether its migration is live.
      - name: Feature deployment-state check
        run: make check-deploy-state

      - name: Agent configuration checks
        run: make check-agent-config

  unit-tests:
    # Single unsharded job: sharding across two runners doubled the
    # install/setup overhead and needed a third job to merge coverage blobs.
    # One runner is ~2 min slower wall-clock but ~5 billable min cheaper,
    # and aggregate coverage thresholds are enforced directly here.
    name: Unit Tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage thresholds
        run: bunx vitest run --coverage

      # Deterministic extractor evals only (--ast, --sql): offline, exact,
      # exits non-zero on regression. The LLM cases need a codex subscription
      # that CI does not have, so they stay local-only.
      - name: Codegraph extractor eval
        run: |
          bun tools/codegraph/eval.ts --ast
          bun tools/codegraph/eval.ts --sql

  build:
    # Nightly/dispatch only, and the ONLY event-gated job here. It builds
    # against the HOSTED Supabase credentials, which fork pull requests cannot
    # read, and it carries the dependency audit. Pull requests are not left
    # without build coverage: the e2e job compiles the same app against its own
    # local stack. `make check` also builds locally before every commit, and
    # Vercel builds on deploy.
    #
    # Because this job is event-gated, nothing that must report on a pull
    # request may declare `needs: build` — a skipped dependency skips the
    # dependent job, and a skipped check reads as passing.
    name: Production Build
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        # Exception requirements: docs/security/dependency-policy.md
        #
        # No active exceptions. Any `--ignore` added here MUST name a concrete
        # GHSA/CVE id with a matching dated policy record —
        # .github/scripts/ci-workflows.test.ts fails the build otherwise.
        # (The last one, GHSA-mh99-v99m-4gvg for brace-expansion, was removed
        # 2026-08-11 after the advisory narrowed its range per major line —
        # the pinned 1.1.18 backport is no longer flagged. #653)
        run: bun audit --audit-level=high

  # Runs on EVERY event this workflow has, pull requests included (#437).
  # Boots an isolated local Supabase stack instead of pointing Playwright at
  # hosted credentials — the hosted E2E secrets were never configured, so the
  # original secrets-gated job silently skipped and the browser suite never ran.
  #
  # Three properties are load-bearing, all learned from that same failure mode:
  #
  #   - No `if:` gate. It had one (`schedule || workflow_dispatch`) from the day
  #     it landed: #506 was authored as a per-PR gate but merged 14 minutes
  #     after #522's minutes diet (2026-07-17T04:04:28Z vs 03:50:19Z), in
  #     nightly form. So E2E had never run on a pull_request event at all
  #     before 2026-07-30, while the check went on looking healthy. Minutes are
  #     free on a public repo; the job's measured wall clock is 5m01s on run
  #     30559728366 (Supabase boot + a build against it + 23.0s of tests).
  #   - No path filter. "Only PRs that touch relevant paths" is the same defect
  #     in a new costume: the PRs it declines to run for still report green.
  #   - No `needs:` AT ALL. Any dependency that is skipped, red or cancelled
  #     skips this job, and a skip reads as green — so `needs:` is a live
  #     route back into the bug this job exists to close. That is measured, not
  #     hypothetical: on main, `Static Checks` failed on the five 2026-07-20..24
  #     nightlies and `Production Build` failed on the four 2026-07-27..30 ones,
  #     and E2E reported "skipped" on all NINE (`gh run view <id> --json jobs`),
  #     on top of every earlier run, which its own `if:` skipped. Its first
  #     successful execution in its life was run 30551975249 on 2026-07-30.
  #     This job consumes nothing from any other job anyway: it re-checks out,
  #     re-installs, boots its own Supabase and runs its own `bun run build`
  #     below. Removing the edge also takes the wait behind static -> unit-tests
  #     off the PR's critical path. Measured, both on real pull_request events:
  #     with the edge, run 30559728366 started e2e 2m54s late (16:04:07Z ->
  #     16:07:01Z) for a 7m55s PR; without it, run 30569164797 started e2e and
  #     static in the same second (18:09:29Z) and the whole PR took 5m14s.
  #
  # Those three rules bind any job whose OWN context is required on `main`,
  # which is true of `Static Checks`, `Unit Tests` and `E2E Tests` here, and of
  # `Database Lint and Integration Tests` in db-lint.yml (#713). A required
  # context must report a conclusion on every pull request, so such a job may
  # never be filtered out of a run, skipped, or made to depend on something
  # that can skip. That is why db-lint.yml no longer carries a `paths:` filter.
  # `Production Build` is deliberately NOT required, precisely because it is
  # schedule-gated below and would otherwise leave every PR pending forever.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Opt-in gate for /api/auth/dev-login, which e2e/auth.setup.ts uses to
      # obtain a session. That route 404s unless NODE_ENV=development, or this
      # is exactly "1" AND the Supabase URL the server's own clients use has a
      # loopback hostname (#656); this lane serves a production `next build` via
      # `bun start`, where NODE_ENV is "production", so without the flag the
      # `setup` project timed out and every authenticated spec failed (#644).
      # Job-scoped (not step-scoped) so it covers both the build and the server
      # Playwright boots, regardless of whether Next reads it at build or run
      # time. Safe here and nowhere else: ephemeral runner, throwaway local
      # Supabase stack, no hosted data reachable. The "Start isolated local
      # Supabase" step below is what sets NEXT_PUBLIC_SUPABASE_URL to the
      # loopback value this flag now additionally requires — if that step ever
      # stops pointing at a local stack, the route goes back to 404ing.
      E2E_DEV_LOGIN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"

      - name: Start isolated local Supabase
        run: |
          set -euo pipefail
          supabase start --exclude vector
          eval "$(supabase status -o env 2>/dev/null)"

          # Fail loudly rather than test nothing (#437's second criterion).
          # `bun run build` runs with SKIP_ENV_VALIDATION=1, so an empty
          # NEXT_PUBLIC_SUPABASE_URL compiles perfectly well and surfaces only
          # as opaque Playwright timeouts several minutes later. `:-` on every
          # read because `set -u` would otherwise abort with a bare "unbound
          # variable" and no actionable message.
          missing=""
          for var in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!var:-}" ]; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::\`supabase status -o env\` exported no value for:${missing}. The E2E lane has no database to run against, so it fails here instead of running an unconfigured suite."
            exit 1
          fi

          # /api/auth/dev-login is the only way this lane obtains a session, and
          # on the E2E_DEV_LOGIN path it answers only when the Supabase URL the
          # server's own clients resolve has a loopback hostname (#656). A
          # non-loopback URL 404s every auth attempt and strands the `setup`
          # project in a timeout, so name the real cause here.
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*|http://\[::1\]:*) ;;
            *)
              echo "::error::Local Supabase API URL is '${API_URL}', which has no loopback hostname. /api/auth/dev-login stays 404 on the E2E_DEV_LOGIN path (#656), so the browser suite cannot authenticate."
              exit 1
              ;;
          esac

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Built here, after the local stack is up, because NEXT_PUBLIC_* values
      # are inlined at build time — the `build` job's artifact is compiled
      # against the hosted project and cannot serve this isolated database.
      # Playwright then runs `bun start` against this build (playwright.config
      # .ts) instead of dev-compiling every route on first hit.
      - name: Build against the local stack
        run: bun run build

      # JSON alongside the HTML report so the next step can prove the run was
      # not vacuous. The JSON lands in RUNNER_TEMP rather than in
      # playwright-report/ because the HTML reporter clears that directory.
      - name: Run E2E tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-results.json
        run: bun e2e --reporter=html,json

      # A Playwright run in which every test skipped exits 0 — verified locally
      # against the @playwright/test this repo actually resolves, 1.61.1
      # (package.json asks for ^1.58.2, so do not cite the range as the version
      # you tested): a two-test all-skipped suite exits 0 and reports
      # `{"expected":0,"skipped":2,...}`. Without this step one stray file-scope
      # `test.skip`, a bad `testMatch`, or a fixture that skips instead of
      # failing would turn this check green while exercising nothing: #437's
      # defect one layer below where it was found.
      #
      # `expected + flaky` because CI retries twice and a test that passes on
      # retry is reported as flaky, not expected. The floor is a tripwire, not
      # a coverage target: 21 pass today (20 enabled specs + the auth setup)
      # against 1 tracked scaffold skip. Do NOT lower it to buy slack — a
      # contract in .github/scripts/ci-workflows.test.ts counts the enabled
      # `test(` declarations under e2e/ and fails if the floor drifts more than
      # 2 below them, precisely so a shrinking suite cannot quietly keep a
      # green gate. Raise both together as scaffolds get implemented.
      - name: Assert the browser suite actually ran
        env:
          E2E_MIN_PASSING: "22"
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/playwright-results.json"
          if [ ! -s "$results" ]; then
            echo "::error::Playwright produced no JSON report at ${results}, so this run cannot be shown to have tested anything. Failing instead of reporting a green E2E gate."
            exit 1
          fi
          passed="$(jq '(.stats.expected // 0) + (.stats.flaky // 0)' "$results")"
          skipped="$(jq '.stats.skipped // 0' "$results")"
          echo "Playwright executed ${passed} passing test(s), ${skipped} skipped (floor: ${E2E_MIN_PASSING})." >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt "$E2E_MIN_PASSING" ]; then
            echo "::error::Only ${passed} E2E test(s) passed (${skipped} skipped); the floor is ${E2E_MIN_PASSING}. An all-skipped Playwright run exits 0, so a green gate here would mean nothing — either the suite lost coverage or the browser lane is broken."
            exit 1
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
