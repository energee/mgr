# CI cost model (see docs/progress/2026-07-16-ci-minutes-diet.md):
# PRs run static + unit only (~7 billable min). Build + E2E run on a weekday
# nightly schedule against main instead of on every merge — local `make check`
# already runs the build before commit, Vercel builds every deploy, and the
# nightly catches squash-merge drift within 24h. Docs-only changes skip CI
# entirely (no required status checks are configured on main, so path
# filtering cannot block merges).
name: Test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    # Weekday nightly full run (static + unit + build + E2E) on main, 06:13 UTC.
    - cron: "13 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Restore static-analysis caches
        uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig.json') }}
          restore-keys: static-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Database policy checks
        run: make check-db

      - name: Feature WIP check
        run: make check-wip

      - name: Agent configuration checks
        run: make check-agent-config

  unit-tests:
    # Single unsharded job: sharding across two runners doubled the
    # install/setup overhead and needed a third job to merge coverage blobs.
    # One runner is ~2 min slower wall-clock but ~5 billable min cheaper,
    # and aggregate coverage thresholds are enforced directly here.
    name: Unit Tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage thresholds
        run: bunx vitest run --coverage

  build:
    # Nightly/dispatch only — not per-PR or per-merge. `make check` runs the
    # same build locally before every commit, and Vercel builds on deploy.
    name: Production Build
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check for dependency vulnerabilities
        # Exception requirements: docs/security/dependency-policy.md
        run: bun audit --audit-level=high

  e2e-secrets-check:
    name: E2E Secrets Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Verify E2E secrets configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          missing=()
          [ -n "$SUPABASE_URL" ]      || missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -n "$E2E_EMAIL" ]         || missing+=("E2E_USER_EMAIL")
          [ -n "$E2E_PASSWORD" ]      || missing+=("E2E_USER_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=E2E skipped::Missing required secrets: ${missing[*]}. Configure via gh secret set (or repo Settings → Secrets) to enable e2e tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-secrets-check
    if: needs.e2e-secrets-check.outputs.configured == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
