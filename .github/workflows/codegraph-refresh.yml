# Keeps the committed tools/codegraph/graph.json fresh (issue #796). The graph
# auto-refreshes for local consumers (query.ts fingerprints its inputs), but
# the COMMITTED artifact drifted silently for weeks because nothing rebuilt it
# on main — a stale map is worse than no map. Same shape as progress.yml: the
# main ruleset rejects direct pushes, so the refreshed artifact lands through
# an auto-merged bot PR. Deterministic passes only (~8s, offline); LLM edges
# are carried over from the committed graph, never re-run here.
name: Refresh codegraph

on:
  push:
    branches: [main]
    paths:
      # Keep in sync with INPUT_GLOBS in tools/codegraph/store.ts, plus the
      # extractor code itself (EXTRACTOR_VERSION changes what passes emit).
      - "src/**"
      - "supabase/migrations/*.sql"
      - "supabase/live-catalog.snapshot.txt"
      - "docs/feature_list.json"
      - "docs/agents/*.md"
      - "docs/spec/*.md"
      - "docs/data-model/*.md"
      - "README.md"
      - "AGENTS.md"
      - "tools/codegraph/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codegraph-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild graph (deterministic passes)
        run: bun tools/codegraph/build.ts
      - name: Commit and merge if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet tools/codegraph/graph.json; then
            echo "graph.json already fresh"
            exit 0
          fi

          branch="automation/codegraph-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add tools/codegraph/graph.json
          git commit -m "chore(codegraph): refresh graph.json"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push --force-with-lease origin "HEAD:$branch"
          fi

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(codegraph): refresh graph.json" \
              --body "Automated deterministic rebuild after a merge touched graph inputs. Maintained by .github/workflows/codegraph-refresh.yml (#796).")"
            pr_number="${pr_url##*/}"
          fi

          # Same enablePullRequestAutoMerge race as progress.yml: "unstable
          # status" while the PR's checks are still starting is transient —
          # retry before going red.
          for attempt in 1 2 3 4; do
            if gh pr merge "$pr_number" \
              --auto \
              --squash \
              --delete-branch \
              --subject "chore(codegraph): refresh graph.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "gh pr merge attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::could not enable auto-merge for PR #${pr_number} after 4 attempts"
          exit 1
