# Keeps the committed tools/codegraph/graph.json fresh (issue #796). The graph
# auto-refreshes for local consumers (query.ts fingerprints its inputs), but
# the COMMITTED artifact drifted silently for weeks because nothing rebuilt it
# on main — a stale map is worse than no map. Same shape as progress.yml: the
# main ruleset rejects direct pushes, so the refreshed artifact lands through
# an auto-merged bot PR. Deterministic passes only (~8s, offline); LLM edges
# are carried over from the committed graph, never re-run here.
#
# The changed-check MUST ignore the volatile `commit`/`built_at` header, and
# the trigger paths MUST exclude graph.json itself: every rebuild stamps the
# new HEAD sha into the artifact, so comparing whole files turns each bot
# merge into another "change" and the workflow merge-loops against itself
# (~29 consecutive metadata-only commits on 2026-08-22). Consumers already
# treat those fields as non-content (Omit<Graph, "commit" | "built_at">).
name: Refresh codegraph

on:
  push:
    branches: [main]
    paths:
      # Keep in sync with INPUT_GLOBS in tools/codegraph/store.ts, plus the
      # extractor code itself (EXTRACTOR_VERSION changes what passes emit).
      - "src/**"
      - "supabase/migrations/*.sql"
      - "supabase/live-catalog.snapshot.txt"
      - "docs/feature_list.json"
      - "docs/agents/*.md"
      - "docs/spec/*.md"
      - "docs/data-model/*.md"
      - "README.md"
      - "AGENTS.md"
      - "tools/codegraph/**"
      # The artifact itself is not an input — see loop note above.
      - "!tools/codegraph/graph.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codegraph-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_APP_ID: ${{ secrets.MGR_AUTOMATION_APP_ID }}
    steps:
      # #844: same as progress.yml — a GITHUB_TOKEN-authored PR triggers no
      # workflows, so the required checks never report and auto-merge waits
      # forever (bot PR #837). Push and open the PR with an app installation
      # token; fall back to GITHUB_TOKEN (still #844-broken) until the
      # operator adds the MGR_AUTOMATION_APP_* secrets.
      - name: Mint bot app token
        id: bot-token
        if: env.BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MGR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.MGR_AUTOMATION_APP_PRIVATE_KEY }}
      - name: Warn on GITHUB_TOKEN fallback
        if: env.BOT_APP_ID == ''
        run: echo "::warning::MGR_AUTOMATION_APP_ID secret not set — falling back to GITHUB_TOKEN; the bot PR will strand BLOCKED with no checks (#844)"
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token || github.token }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild graph (deterministic passes)
        run: bun tools/codegraph/build.ts
      - name: Commit and merge if changed
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Compare bodies only — `commit`/`built_at` change on every rebuild
          # and must not count as drift (see loop note in the header comment).
          body() { jq -S 'del(.commit, .built_at)' "$1"; }
          if diff -q <(body tools/codegraph/graph.json) \
                     <(git show HEAD:tools/codegraph/graph.json | body /dev/stdin) >/dev/null; then
            echo "graph.json body already fresh (metadata-only diff ignored)"
            exit 0
          fi

          branch="automation/codegraph-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add tools/codegraph/graph.json
          git commit -m "chore(codegraph): refresh graph.json"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:$branch"
          else
            git push --force-with-lease origin "HEAD:$branch"
          fi

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(codegraph): refresh graph.json" \
              --body "Automated deterministic rebuild after a merge touched graph inputs. Maintained by .github/workflows/codegraph-refresh.yml (#796).")"
            pr_number="${pr_url##*/}"
          fi

          # Same enablePullRequestAutoMerge race as progress.yml: "unstable
          # status" while the PR's checks are still starting is transient —
          # retry before going red.
          for attempt in 1 2 3 4; do
            if gh pr merge "$pr_number" \
              --auto \
              --squash \
              --delete-branch \
              --subject "chore(codegraph): refresh graph.json"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "gh pr merge attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::could not enable auto-merge for PR #${pr_number} after 4 attempts"
          exit 1
