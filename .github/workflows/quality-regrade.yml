# .github/workflows/quality-regrade.yml
#
# Weekly quality re-grade. Re-evaluates docs/agents/quality.md against its
# rubric, moves grades only where evidence has changed, appends a trend-log
# line, and opens a PR.
#
# Per docs/agents/observability.md, this is Lecture-11 Layer 3 observability:
# a structured snapshot of codebase health that future-you can compare across
# time. The first baseline was set 2026-05-04 in PR #249.
#
# Note: the prompt below contains no event-derived inputs (no PR titles,
# issue bodies, etc.) — only a static literal string and secrets. No
# command-injection surface.

name: Quality re-grade

on:
  schedule:
    # Every Monday at 13:00 UTC = 9am EDT / 8am EST.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  regrade:
    name: Re-grade docs/agents/quality.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Task: Re-grade `docs/agents/quality.md` against the rubric in the doc and append a new trend-log line. Open a PR.

            Steps:
            1. Read `docs/agents/quality.md` start-to-finish. The "How to update" section at the bottom is binding. Read the existing trend-log to understand history.
            2. Gather evidence for each domain/layer:
               - `git log --since="$(date -u -d '8 days ago' +%Y-%m-%d)" --pretty=format:"%h %s" -- supabase/migrations/ src/entities/ src/components/ src/hooks/ src/lib/`
               - `ls supabase/migrations/ | tail -10`
               - `make check-db` — note any new violations or grandfather-list shrinkage
               - `bun run test 2>&1 | tail -5` — note pass count delta vs the previous baseline
               - `grep -c "manual" docs/feature_list.json` — fewer manuals = better verification coverage
               - `gh pr list --state merged --search "merged:>$(date -u -d '8 days ago' +%Y-%m-%d)" --limit 50`
               - `wc -l scripts/check-*.allowlist.txt` — allowlist size is grandfathered debt
            3. Move a grade only when evidence has changed. Bug fix delivered, refactor merged, new pattern adopted, audit surfaced debt, allowlist shrunk. No vibes-based moves.
            4. For each grade you change: update the cell value AND its `As of` date AND its notes line.
            5. Append a single trend-log line dated today summarizing what shifted. If nothing shifted, say so explicitly — that is a valid outcome.
            6. Run `make check-fast`. If green, optionally run `make check`.
            7. Create a branch named `quality-regrade-$(date -u +%Y-%m-%d)`, commit with message `docs: quality re-grade $(date -u +%Y-%m-%d)`, push, and open a PR with the same title. PR body should list grades moved + why, cite evidence (commit SHAs, PR numbers, allowlist deltas), and link the most recent prior re-grade PR.
            8. Apply labels `quality-regrade` and `automated`.
            9. Do not change the rubric definitions, the "How to update" rules, or any prior trend-log entries.

            Constraints:
            - One commit, one PR. No unrelated refactors.
            - No new tickets.
            - If `make check-fast` fails because of your edits, fix it. If pre-existing, note in PR body and proceed.
            - If no grades moved AND no notable evidence accumulated, the PR is still valid — it documents the "nothing shifted" data point.
