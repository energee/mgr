# .github/workflows/quality-regrade.yml
#
# Weekly quality re-grade. Re-evaluates docs/agents/quality.md against its
# rubric, moves grades only where evidence has changed, appends a trend-log
# line, and opens a PR.
#
# Per docs/agents/observability.md, this is Lecture-11 Layer 3 observability:
# a structured snapshot of codebase health that future-you can compare across
# time. The first baseline was set 2026-05-04 in PR #249.
#
# Note: the prompt below contains no event-derived inputs (no PR titles,
# issue bodies, etc.) — only a static literal string and secrets. No
# command-injection surface.

name: Quality re-grade

on:
  schedule:
    # Every Monday at 13:00 UTC = 9am EDT / 8am EST.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  regrade:
    name: Re-grade docs/agents/quality.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pre-compute the lookback date once so the prompt has a stable value
      # and we don't depend on GNU `date -d` being available everywhere.
      - name: Compute lookback window
        id: window
        run: |
          since="$(date -u -d '8 days ago' +%Y-%m-%d)"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          count=$(git log --since="$since" --oneline | wc -l | tr -d ' ')
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.window.outputs.commit_count != '0' || github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          cache: true

      - name: Install dependencies
        if: steps.window.outputs.commit_count != '0' || github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile

      # Skip the LLM call on weeks with zero new commits — manual dispatch
      # always proceeds so you can force a regrade after non-code events.
      - name: Run Claude Code Action
        if: steps.window.outputs.commit_count != '0' || github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Evidence-gathering against a fixed rubric — a lighter model is
          # sufficient; the rubric doc itself is binding and constrains output.
          claude_args: '--model claude-sonnet-5'
          prompt: |
            Task: Re-grade `docs/agents/quality.md` against the rubric in the doc and append a new trend-log line. Open a PR. The "How to update" section at the bottom of the doc is binding — read it first and follow it; do not restate or override its rules from this prompt.

            Lookback window: ${{ steps.window.outputs.since }} to today. ${{ steps.window.outputs.commit_count }} commit(s) in that window.

            Evidence to gather (run all; report what you find):
              - `git log --since="${{ steps.window.outputs.since }}" --pretty=format:"%h %s" -- supabase/migrations/ src/entities/ src/components/ src/hooks/ src/lib/`
              - `ls supabase/migrations/ | tail -10`
              - `make check-db` — note any new violations or grandfather-list shrinkage
              - `bun run test 2>&1 | tail -5` — note pass count delta
              - `grep -c "manual" docs/feature_list.json` — fewer manuals = better verification coverage
              - `gh pr list --state merged --search "merged:>${{ steps.window.outputs.since }}" --limit 50`
              - `wc -l scripts/check-*.allowlist.txt` — allowlist size is grandfathered debt

            Output:
              1. For each grade you change: update the cell value AND its `As of` date AND its notes line.
              2. Append a single trend-log line dated today summarizing what shifted. If nothing shifted, say so explicitly.
              3. Run `make check-fast`. If green, optionally run `make check`.
              4. Create a branch `quality-regrade-$(date -u +%Y-%m-%d)`, commit with message `docs: quality re-grade $(date -u +%Y-%m-%d)`, push, open a PR with the same title.
              5. Apply labels `quality-regrade` and `automated`.

            Constraints:
              - One commit, one PR. No unrelated refactors. No new tickets.
              - Do not change the rubric definitions or any prior trend-log entries.
              - If `make check-fast` fails because of your edits, fix it. If pre-existing, note in PR body and proceed.
